    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- We add the font in index.html not in CSS
         because index.html loads first. If added in CSS, there's
         a brief flash of system font (FOUT — Flash Of Unstyled Text)
         before the custom font loads. Preconnect hints tell the
         browser to connect to Google Fonts early. -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
